[General]
SkipLauncher = 1

[Graphics]
OutputMethod = SDL
Fullscreen = 1
LinearFiltering = 1

[Sound]
EnableAudio = 1
AudioFreq = 48000

[GamepadMap]
EnableGamepad1 = true
# El jugador 2 va DESHABILITADO a proposito (2026-09-13), y es lo que hace que el
# mando responda. En la Xbox, SDL reporta el mando con indice de jugador 1 (base 0),
# y OpenOneGamepad (src/main.c) toma ese indice como PRIMER candidato de hueco: con
# el jugador 2 habilitado, el unico mando caia en el puerto 2 del SNES, que en Super
# Metroid no hace nada, y no respondia ni un boton. Deshabilitado, ese candidato se
# descarta y el mando entra en el jugador 1.
EnableGamepad2 = false
GamepadDeadzone = 10000
# Mando de Xbox pedido por el usuario (2026-09-11). La lista son los DOCE botones
# del mando de SNES, SIEMPRE en este orden:
#
#   Arriba, Abajo, Izquierda, Derecha, Select, Start, A, B, X, Y, L, R
#
# y con la configuracion POR DEFECTO de Super Metroid cada uno hace esto:
#
#   SNES A      = SALTAR            -> A
#   SNES B      = CORRER            -> Rb  (RB / R1)
#   SNES X      = DISPARAR          -> X
#   SNES Y      = CANCELAR ITEM     -> B   (no lo pidio; va aqui por descarte)
#   SNES Select = SELECCIONAR MISIL -> Y
#   SNES L      = APUNTAR ABAJO     -> L2  (LT / L2)
#   SNES R      = APUNTAR ARRIBA    -> R2  (RT / R2)
#
# Si alguna vez se cambia la configuracion DENTRO del juego, esta tabla deja de
# valer: el juego mapea acciones a botones de SNES, y esto mapea botones de SNES
# a botones de Xbox.
Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Y, Start, A, Rb, X, B, L2, R2
ControlsP2 = DpadUp, DpadDown, DpadLeft, DpadRight, Y, Start, A, Rb, X, B, L2, R2
